name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src tests

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (no PyTorch - serving and tests only need NumPy)
        run: pip install -e ".[llm,dev]"
      - name: Run tests
        run: python -m pytest -o addopts="" -q

  benchmark:
    name: Benchmark smoke run + figures
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[llm,dev]"
      - name: Evaluate default preset (1 seed)
        run: python -m flutter_ai evaluate --preset uav_flap --seeds 1
      - name: Validate the template dataset
        run: python -m flutter_ai check-data data/template_synthetic
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-uav_flap
          path: outputs/uav_flap/
          retention-days: 30

  docker:
    name: Docker image build + health check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flutter-lab:ci .
      - name: Start container and query /api/health
        run: |
          docker run -d --name fl -p 8000:8000 flutter-lab:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/health && exit 0; sleep 2; done
          docker logs fl
          exit 1
